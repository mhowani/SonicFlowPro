<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SonicFlowPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    /* Layout: cabecera con marca, barra de 3 pestañas fija, vista en tarjetas de ancho máximo 880px */
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #F6F5FB;
      --surface: #FFFFFF;
      --surface-2: #F0EEF8;
      --fg: #1C1933;
      --muted: #625E7C;
      --line: #E2DFEE;
      --accent: #8B5CF6;
      --accent-text: #6A3CE0;
      --accent-soft: #EEE8FE;
      --on-accent: #FFFFFF;
      --orange: #F97316;
      --pink: #EC4899;
      --cyan: #0891B2;
      --purple: #8B5CF6;
      --indigo: #6366F1;
      --green: #16A34A;
      --teal: #0D9488;
      --ok: #16A34A;
      --warn: #EA8A0C;
      --hot: #DC2626;
      --shadow: 0 1px 2px rgba(28,25,51,.06), 0 4px 14px rgba(28,25,51,.05);
      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12101F;
        --surface: #1B1830;
        --surface-2: #242040;
        --fg: #EEEBFA;
        --muted: #A5A0C2;
        --line: #2F2A4D;
        --accent: #8B5CF6;
        --accent-text: #B9A1FF;
        --accent-soft: #2B2255;
        --orange: #FB923C;
        --pink: #F472B6;
        --cyan: #22D3EE;
        --purple: #A78BFA;
        --indigo: #818CF8;
        --green: #4ADE80;
        --teal: #2DD4BF;
        --ok: #4ADE80;
        --warn: #FBBF24;
        --hot: #F87171;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #12101F;
      --surface: #1B1830;
      --surface-2: #242040;
      --fg: #EEEBFA;
      --muted: #A5A0C2;
      --line: #2F2A4D;
      --accent: #8B5CF6;
      --accent-text: #B9A1FF;
      --accent-soft: #2B2255;
      --orange: #FB923C;
      --pink: #F472B6;
      --cyan: #22D3EE;
      --purple: #A78BFA;
      --indigo: #818CF8;
      --green: #4ADE80;
      --teal: #2DD4BF;
      --ok: #4ADE80;
      --warn: #FBBF24;
      --hot: #F87171;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
      color-scheme: dark;
    }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    * { box-sizing: border-box; }
    [hidden]:not([hidden=until-found i]) { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      padding-block: 0 56px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg);
      z-index: 10;
    }

    .wrap {
      width: 100%;
      max-width: 880px;
      margin-inline: auto;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    /* Cabecera */
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-block: 20px 14px;
      flex-wrap: wrap;
    }
    .brand-main { display: flex; align-items: center; gap: 12px; }
    .logo-wrap {
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #33399D;
      display: grid;
      place-items: center;
    }
    .logo-wrap img, .logo-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .brand h1 { margin: 0; font: 700 24px/1.1 var(--font-display); letter-spacing: -.01em; }
    .brand h1 span { color: var(--accent-text); }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .session-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      box-shadow: var(--shadow);
    }
    .session-pill i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    /* Pestañas principales */
    .tabs-bar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 9;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding-block: 6px 0; }
    .tab {
      background: none;
      border: 0;
      padding: 10px 6px 12px;
      color: var(--muted);
      font: 600 14px var(--font-body);
      border-bottom: 3px solid transparent;
      border-radius: 8px 8px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: background .15s, color .15s;
    }
    .tab small { font: 500 11px var(--font-body); opacity: .8; }
    .tab[aria-selected="true"] {
      color: var(--accent-text);
      border-bottom-color: var(--accent);
      background: var(--accent-soft);
    }
    .tab:hover:not([aria-selected="true"]) { background: var(--surface-2); }

    main { padding-block: 18px 0; }

    /* Subpestañas */
    .seg {
      display: inline-flex;
      max-width: 100%;
      background: var(--surface-2);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
      overflow-x: auto;
    }
    .seg button {
      background: none;
      border: 0;
      padding: 7px 14px;
      border-radius: 8px;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }
    .seg button[aria-selected="true"] {
      background: var(--surface);
      color: var(--accent-text);
      box-shadow: var(--shadow);
    }

    /* Herramientas */
    .toolbar { display: flex; flex-direction: column; gap: 12px; margin-block: 16px 14px; }
    .search { position: relative; }
    .search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
    .search input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 15px;
    }
    .search input::placeholder { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
    }
    .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); }
    .chip[aria-pressed="true"] {
      border-color: var(--c, var(--accent));
      background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--surface));
      font-weight: 600;
    }
    .row-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .count { color: var(--muted); font-size: 13px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-weight: 600;
      font-size: 13px;
      transition: border-color .15s, background .15s, color .15s, transform .08s;
    }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
    .btn.step-btn { padding: 7px 11px; min-width: 42px; font-family: var(--font-mono); }
    .btn:hover { border-color: var(--accent); }
    .btn.done { border-color: var(--ok); color: var(--ok); }
    .btn.primary.done { background: var(--ok); border-color: var(--ok); color: #fff; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* Tarjetas */
    .list { display: grid; gap: 14px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .badge {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font: 700 15px var(--font-display);
      color: var(--c, var(--accent));
      background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface));
    }
    .card-head h3 { margin: 0; font: 600 17px var(--font-display); flex: 1; min-width: 140px; }
    .card-head small { display: block; color: var(--muted); font: 400 12px var(--font-body); }
    .params { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .param { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
    .param dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 3px; }
    .param dd { margin: 0; font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
    .param.boost dd { color: var(--c); font-weight: 600; }
    .tip {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      background: color-mix(in srgb, var(--c, var(--accent)) 10%, var(--surface));
    }
    .tip b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--c, var(--accent)); margin-right: 6px; }

    /* Compresión */
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .metric { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
    .metric dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 3px; }
    .metric dd { margin: 0; font-size: 14px; font-weight: 600; }
    .ratio-bar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 12px; overflow: hidden; }
    .ratio-bar span { display: block; height: 100%; background: var(--c); border-radius: 3px; }

    .section-title { font: 600 13px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
    .presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .preset {
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 4px solid var(--c);
      border-radius: 12px;
      padding: 14px;
      min-width: 0;
    }
    .preset h4 { margin: 0 0 8px; font: 700 16px var(--font-display); color: var(--c); }
    .preset dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
    .preset dt { color: var(--muted); }
    .preset dd { margin: 0; text-align: right; font-weight: 600; }

    /* Glosario */
    .term h3 { margin: 0 0 4px; font: 600 17px var(--font-display); }
    .term p { margin: 0; color: var(--muted); }
    .term .typical { margin-top: 10px; font-size: 13px; }
    .term .typical b { color: var(--accent-text); }

    /* =========================================================================
       PESTAÑA 2: FLUJO & NIVELES
       ========================================================================= */
    .flow-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .flow-header-bar h2 {
      margin: 0;
      font: 700 19px var(--font-display);
    }
    .flow-header-bar p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .calc-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .big-readout {
      display: flex;
      align-items: baseline;
      gap: 8px;
      background: var(--surface-2);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .big-readout strong {
      font: 700 26px/1 var(--font-mono);
      color: var(--c, var(--accent-text));
    }
    .big-readout span {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--c, var(--accent));
      height: 6px;
      cursor: pointer;
    }

    .preset-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 14px;
    }
    .preset-pills > span {
      font-size: 12px;
      color: var(--muted);
      margin-right: 4px;
      font-weight: 500;
    }
    .pill-btn {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 600;
    }
    .pill-btn[aria-pressed="true"] {
      background: var(--c, var(--accent));
      border-color: var(--c, var(--accent));
      color: #fff;
    }

    .tap-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--indigo) 10%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--indigo) 28%, var(--line));
      margin-bottom: 14px;
    }
    .tap-info {
      font-size: 13px;
      color: var(--fg);
    }
    .tap-info small {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .tap-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn.tap-trigger {
      background: var(--indigo);
      border-color: var(--indigo);
      color: #fff;
      padding: 9px 16px;
    }

    .quick-ms-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .quick-ms {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 10px 12px;
      border-left: 3px solid var(--c, var(--indigo));
    }
    .quick-ms dt {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .quick-ms dd {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--fg);
    }

    .div-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .div-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .div-table th {
      text-align: left;
      padding: 9px 12px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 600;
    }
    .div-table th:last-child,
    .div-table td:last-child {
      text-align: right;
    }
    .div-table td {
      padding: 9px 12px;
      border-top: 1px solid var(--line);
    }
    .div-table tr:hover td {
      background: color-mix(in srgb, var(--indigo) 5%, transparent);
    }

    /* Zona de nivel y alerta en calculadora dB */
    .zone-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 11px 14px;
      border-radius: 11px;
      border: 1px solid var(--zc, var(--ok));
      background: color-mix(in srgb, var(--zc, var(--ok)) 12%, var(--surface));
      margin-bottom: 12px;
    }
    .zone-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--zc, var(--ok));
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
    }
    .zone-msg {
      font-size: 13px;
      font-weight: 500;
      color: var(--fg);
      flex: 1;
      min-width: 180px;
    }
    .alert-hot {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--hot) 14%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--hot) 45%, var(--line));
      color: var(--hot);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* Checklist 9 pasos */
    .project-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface-2);
      margin-bottom: 12px;
    }
    .project-bar label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .project-select {
      flex: 1;
      min-width: 200px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
    }
    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width .25s ease;
    }
    .checklist-grid {
      display: grid;
      gap: 8px;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      transition: background .15s, border-color .15s;
    }
    .step-item:hover {
      border-color: var(--accent);
    }
    .step-item[aria-checked="true"] {
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    }
    .step-check {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: var(--surface);
    }
    .step-item[aria-checked="true"] .step-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .step-num {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      min-width: 22px;
    }
    .step-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
    }
    .step-item[aria-checked="true"] .step-title {
      text-decoration: line-through;
      opacity: .75;
    }
    .step-tag {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface-2);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* Niveles, LUFS y Panorámica */
    .level-bars {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }
    .lvl-row {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .lvl-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .lvl-head strong { color: var(--c); }
    .lvl-track {
      height: 7px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--c) 18%, var(--surface));
      overflow: hidden;
    }
    .lvl-track span {
      display: block;
      height: 100%;
      background: var(--c);
      border-radius: 999px;
    }

    .lufs-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .lufs-card {
      border: 1px solid var(--line);
      border-left: 4px solid var(--c, var(--teal));
      border-radius: 10px;
      padding: 12px;
      background: var(--surface);
    }
    .lufs-card h4 {
      margin: 0 0 6px;
      font: 700 15px var(--font-display);
      color: var(--c, var(--teal));
    }
    .lufs-card p {
      margin: 3px 0;
      font-size: 13px;
      color: var(--fg);
    }
    .lufs-card small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .pan-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .pan-card {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 11px 12px;
      border-top: 3px solid var(--c, var(--indigo));
    }
    .pan-card strong {
      display: block;
      font-size: 13px;
      color: var(--c, var(--indigo));
      margin-bottom: 4px;
    }
    .pan-card p {
      margin: 0;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Vistas pendientes */
    .todo { border-style: dashed; box-shadow: none; }
    .todo h2 { margin: 0 0 6px; font: 700 20px var(--font-display); }
    .todo p { margin: 0 0 14px; color: var(--muted); }
    .todo ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
    .empty { text-align: center; color: var(--muted); padding: 32px 16px; border: 1px dashed var(--line); border-radius: 14px; }

    .foot { color: var(--muted); font-size: 12px; margin-top: 28px; text-align: center; }

    .toast {
      position: fixed;
      left: 50%;
      translate: -50% 12px;
      opacity: 0;
      pointer-events: none;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      background: var(--fg);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      transition: opacity .2s, translate .2s;
      z-index: 20;
    }
    .toast.show { opacity: 1; translate: -50% 0; }

    @media (max-width: 640px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .presets { grid-template-columns: 1fr; }
      .quick-ms-grid { grid-template-columns: 1fr; }
      .lufs-grid { grid-template-columns: 1fr; }
      .pan-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 380px) { .params { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .toast, .progress-fill { transition: none; } }

  <script>
    /* =========================================================================
       DATOS BASE DE SONICFLOWPRO

    const EQ = [
      { id:'kick', name:'Kick (Bombo)', short:'Kick', color:'--orange',

    const COMP_CATS = ['Todos','Batería','Bajo / Armónicos','Voces','Bus / Master'];
    const CAT_COLOR = { 'Batería':'--orange', 'Bajo / Armónicos':'--indigo', 'Voces':'--green', 'Bus / Master':'--teal' };
    const COMP = [
      { name:'Kick (Bombo)', cat:'Batería', ratio:4, attack:'30 ms', release:'80 ms', gain:'3–5 dB de reducción' },

      { name:'Hats (Hi-Hats)', cat:'Batería', ratio:2, attack:'5 ms', release:'60 ms', gain:'1–2 dB de reducción' },
      { name:'Toms', cat:'Batería', ratio:4, attack:'15 ms', release:'120 ms', gain:'3–5 dB de reducción' },
      { name:'Bajo', cat:'Bajo / Armónicos', ratio:4, attack:'30 ms', release:'120 ms', gain:'3–6 dB de reducción' },
      { name:'Sub / 808', cat:'Bajo / Armónicos', ratio:3, attack:'40 ms', release:'200 ms', gain:'2–4 dB de reducción' },
      { name:'Sintes y armónicos', cat:'Bajo / Armónicos', ratio:2, attack:'20 ms', release:'150 ms', gain:'2–3 dB de reducción' },
      { name:'Vocal Principal', cat:'Voces', ratio:3, attack:'8 ms', release:'80 ms', gain:'3–6 dB de reducción' },

    const PRESETS = [
      { name:'Light', color:'--ok',   ratio:'2:1', knee:'6 dB (suave)', attack:'30 ms', release:'150 ms', note:'Control sutil, casi invisible.' },
      { name:'Med',   color:'--warn', ratio:'4:1', knee:'3 dB',         attack:'15 ms', release:'100 ms', note:'Compresión audible y firme.' },
      { name:'Harsh', color:'--hot',  ratio:'8:1', knee:'0 dB (duro)',  attack:'5 ms',  release:'60 ms',  note:'Agresiva, para dar carácter.' }
    ];

    const GLOSS = [
      { term:'Threshold', def:'Nivel a partir del cual el compresor empieza a actuar. Todo lo que pasa de ese umbral se reduce.', typical:'Entre −30 y −10 dB, según la fuente.' },
      { term:'Ratio', def:'Cuánto se reduce la señal que supera el umbral. Con 4:1, por cada 4 dB que se pase, salen 1 dB.', typical:'1.5:1 en bus master, 4:1 en percusión.' },
      { term:'Knee', def:'Transición alrededor del umbral. Duro (hard) actúa de golpe; suave (soft) entra de forma gradual.', typical:'0 dB duro, 6 dB suave.' },
      { term:'Attack', def:'Tiempo que tarda el compresor en reaccionar. Ataques lentos dejan pasar el transitorio; rápidos lo aplastan.', typical:'5–30 ms en batería.' },
      { term:'Release', def:'Tiempo que tarda en soltar la señal al bajar del umbral. Muy corto bombea; muy largo apaga el groove.', typical:'60–200 ms en la mayoría de fuentes.' },
      { term:'Gain', def:'Ganancia de compensación (makeup) para recuperar el nivel que se pierde al comprimir.', typical:'Igual a la reducción media, para comparar con y sin compresor.' }
    ];

    /* Datos para Pestaña 2: Flujo & Niveles */
    const BPM_PRESETS = [90, 110, 120, 128, 140];
    const GAIN_PRESETS = [-12, -6, -3, 0, 6];

    const RHYTHM_DIVISIONS = [
      { label: 'Compás 4/4', code: '4/1', mult: 4 },
      { label: 'Negra', code: '1/4', mult: 1 },
      { label: 'Negra puntillo', code: '1/4.', mult: 1.5 },
      { label: 'Tresillo negra', code: '1/4T', mult: 2 / 3 },
      { label: 'Corchea', code: '1/8', mult: 0.5 },
      { label: 'Semicorchea', code: '1/16', mult: 0.25 },

    const MIX_FLOW_STEPS = [
      { title: 'Gain Staging', tag: 'Preparación' },
      { title: 'Surgical EQ', tag: 'Limpieza' },
      { title: 'Tonal EQ & Frequency Slotting', tag: 'Balance' },
      { title: '1ª Compresión', tag: 'Control picos' },
      { title: 'De-Essing', tag: 'Sibilancia' },
      { title: 'Siguiente Compresión', tag: 'Carácter / Glue' },

      { title: 'Reverb & Delay', tag: 'Profundidad' },
      { title: 'Limitador', tag: 'Control final' }
    ];

    const LEVEL_ZONES = [
      { name: 'Fuerte', range: 'Por encima de −6 dBFS', pct: 92, color: '--hot', desc: 'Zona caliente: vigila picos transitorios y headroom antes del bus master.' },
      { name: 'Normal', range: 'Entre −18 dBFS y −6 dBFS', pct: 64, color: '--ok', desc: 'Zona óptima de trabajo en mezcla con margen limpio para procesos.' },
      { name: 'Silencioso', range: 'Por debajo de −18 dBFS', pct: 28, color: '--cyan', desc: 'Señal baja o capas de fondo; asegura buena relación señal/ruido.' }
    ];

    const LUFS_TARGETS = [
      {
        title: 'Pre-Master / Mezcla',
        color: '--indigo',
        lufs: '−18 a −14 LUFS integrados',
        peak: 'True Peak: −6.0 a −3.0 dBTP',
        note: 'Deja margen limpio y dinámica intacta antes de limitar o enviar a master.'
      },
      {
        title: 'Streaming / Lanzamiento',
        color: '--teal',
        lufs: '−14 a −9 LUFS integrados',
        peak: 'True Peak: −1.0 dBTP máx.',
        note: 'Evita distorsión inter-sample en Spotify, Apple Music y YouTube.'
      }
    ];

    const PAN_GUIDES = [
      {
        title: 'Centro / Mono',
        color: '--purple',
        desc: 'Kick, Sub / 808, Bajo, Snare y Vocal Principal para máxima pegada y solidez.'
      },
      {
        title: '50% Izquierdo',
        color: '--cyan',
        desc: 'Guitarra rítmica 1, teclas de apoyo, percusión secundaria o doble de coro L.'
      },
      {
        title: '50% Derecho',
        color: '--orange',
        desc: 'Guitarra rítmica 2, arpegios, respuesta melódica o doble de coro R.'
      }
    ];

    /* =========================================================================
       UTILIDADES Y PERSISTENCIA EN LOCALSTORAGE
       ========================================================================= */
    const $ = (s, r = document) => r.querySelector(s);
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const cvar = n => `var(${n})`;

    const store = {
      get(k, d) {
        try {
          const v = localStorage.getItem(k);
          return v === null ? d : v;
        } catch (e) {
          return d;
        }
      },
      set(k, v) {
        try {
          localStorage.setItem(k, v);
        } catch (e) {}
      },
      getJSON(k, d) {
        try {
          const v = localStorage.getItem(k);
          return v ? JSON.parse(v) : d;
        } catch (e) {
          return d;
        }
      },
      setJSON(k, v) {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {}
      }
    };

    const PROJECTS_KEY = 'sfp.projects';
    const ACTIVE_PROJECT_KEY = 'sfp.activeProjectId';

    function ensureDefaultProjects() {
      let list = store.getJSON(PROJECTS_KEY, null);
      if (!Array.isArray(list) || !list.length) {
        list = [
          {
            id: 'proj-demo-1',
            title: 'Mezcla Demo — Midnight Pulse',
            meta: '120 BPM · Fa menor',
            stage: 'Mezcla',
            notes: 'Separar bien Kick y Sub/808; revisar sibilancia vocal antes del limitador.',
            steps: [true, true, true, false, false, false, false, false, false],
            updatedAt: new Date().toISOString()
          }
        ];
        store.setJSON(PROJECTS_KEY, list);
      }
      let activeId = store.get(ACTIVE_PROJECT_KEY, list[0].id);
      if (!list.some(p => p.id === activeId)) {
        activeId = list[0].id;
        store.set(ACTIVE_PROJECT_KEY, activeId);
      }
      return { list, activeId };
    }

    let toastTimer;
    function toast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    async function copyText(text, btn) {
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (e) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ok = document.execCommand('copy');
          ta.remove();
        } catch (e2) {}
      }
      if (ok) {
        toast('Copiado al portapapeles');
        if (btn) {
          const old = btn.innerHTML;
          btn.classList.add('done');
          btn.textContent = 'Copiado ✓';
          setTimeout(() => {
            btn.classList.remove('done');
            btn.innerHTML = old;
          }, 1600);
        }
      } else {
        toast('No se pudo copiar');
      }
    }

    const iconSearch = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>';
    const iconCopy = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="2"/><path d="M11 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h1"/></svg>';
    const iconReset = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 1 1.4 3.7"/><path d="M2.5 4v4h4"/></svg>';

    /* =========================================================================
       ESTADO GLOBAL DE LA APP
       ========================================================================= */
    const initialBPM = Math.min(180, Math.max(60, parseInt(store.get('sfp.lastBPM', '120'), 10) || 120));
    const parsedGain = parseFloat(store.get('sfp.lastGainDB', '-6.0'));
    const initialGain = Number.isFinite(parsedGain) ? Math.min(24, Math.max(-24, parsedGain)) : -6.0;
    const initialProjects = ensureDefaultProjects();

    const state = {
      tab: 'guia',
      sub: store.get('sfp.sub', 'eq'),
      q: '',
      inst: null,
      cat: 'Todos',
      lastBPM: initialBPM,
      lastGainDB: initialGain,
      tapTimes: [],
      projects: initialProjects.list,
      activeProjectId: initialProjects.activeId
    };

    const TABS = ['guia', 'flujo', 'mezclas'];

    function updateSessionPill() {
      const sign = state.lastGainDB > 0 ? '+' : '';
      const el = $('#sessionPillText');
      if (el) el.textContent = `${state.lastBPM} BPM · ${sign}${state.lastGainDB.toFixed(1)} dB`;
    }

    function setTab(t, fromHash) {
      if (!TABS.includes(t)) t = 'guia';
      state.tab = t;
      /* Limpieza de filtros al cambiar de pestaña */
      state.q = '';
      state.inst = null;
      state.cat = 'Todos';
      store.set('sfp.tab', t);
      document.querySelectorAll('.tab').forEach(b => {
        const on = b.dataset.tab === t;
        b.setAttribute('aria-selected', on);
        b.tabIndex = on ? 0 : -1;
      });
      $('#view').setAttribute('aria-labelledby', 'tab-' + t);
      if (!fromHash && location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
      render();
    }

    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
    window.addEventListener('hashchange', () => setTab(location.hash.slice(1), true));

    function render() {
      updateSessionPill();
      const v = $('#view');
      if (state.tab === 'guia') renderGuia(v);
      else if (state.tab === 'flujo') renderFlujo(v);
      else renderMezclasPreview(v);
    }

    /* =========================================================================
       PESTAÑA 1: GUÍA & EQ
       ========================================================================= */
    function renderGuia(v) {
      const subs = [['eq', 'EQ'], ['comp', 'Compresión'], ['gloss', 'Glosario']];
      v.innerHTML = `
        <div class="seg" role="tablist" aria-label="Guía">
          ${subs.map(([id, l]) => `<button role="tab" data-sub="${id}" aria-selected="${state.sub === id}">${l}</button>`).join('')}
        </div>
        <div id="sub"></div>`;
      v.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => {
        state.sub = b.dataset.sub;
        state.q = '';
        state.inst = null;
        state.cat = 'Todos';
        store.set('sfp.sub', state.sub);
        renderGuia(v);
      }));
      const host = $('#sub');
      if (state.sub === 'eq') mountEQ(host);
      else if (state.sub === 'comp') mountComp(host);
      else mountGloss(host);
    }

    function bindSearch(host, onInput) {
      const i = $('input', host);
      i.value = state.q;
      i.addEventListener('input', () => {
        state.q = i.value;
        onInput();
      });
    }
    const searchBox = ph => `<div class="search">${iconSearch}<input id="q" type="search" placeholder="${ph}" aria-label="${ph}" autocomplete="off"></div>`;

    /* Subsección EQ */
    const eqText = e => `${e.name}\nLow Cut: ${e.lowCut}\nLow Shelf: ${e.lowShelf}\nBoost: ${e.boost}\nHigh Cut: ${e.highCut}\nPro Tip: ${e.tip}`;

    function mountEQ(host) {
      host.innerHTML = `
        <div class="toolbar">
          ${searchBox('Buscar instrumento, parámetro o frecuencia (ej. 3 kHz)')}
          <div class="chips" id="chips">
            ${EQ.map(e => `<button class="chip" style="--c:${cvar(e.color)}" data-id="${e.id}" aria-pressed="false"><i></i>${e.short}</button>`).join('')}
          </div>
          <div class="row-actions"><span class="count" id="count"></span><button class="btn primary" id="copyAll">${iconCopy} Copiar guía</button></div>
        </div>
        <div class="list" id="results"></div>`;
      bindSearch(host, updateEQ);
      host.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        state.inst = state.inst === c.dataset.id ? null : c.dataset.id;
        updateEQ();
      }));
      updateEQ();
    }

    function filteredEQ() {
      const q = norm(state.q.trim());
      return EQ.filter(e => (!state.inst || e.id === state.inst) &&
        (!q || norm(['Low Cut', 'Low Shelf', 'Boost', 'High Cut', 'Pro Tip', e.name, e.lowCut, e.lowShelf, e.boost, e.highCut, e.tip].join(' ')).includes(q)));
    }

    function updateEQ() {
      const list = filteredEQ();
      document.querySelectorAll('#chips .chip').forEach(c => c.setAttribute('aria-pressed', state.inst === c.dataset.id));
      $('#count').textContent = `${list.length} de ${EQ.length} instrumentos`;
      const all = $('#copyAll');
      const filtered = list.length !== EQ.length;
      all.innerHTML = `${iconCopy} ${filtered ? 'Copiar coincidencias' : 'Copiar guía completa'}`;
      all.disabled = !list.length;
      all.onclick = () => copyText(list.map(eqText).join('\n\n'), all);
      const res = $('#results');
      if (!list.length) {
        res.innerHTML = '<div class="empty">Ningún instrumento coincide. Prueba con otra frecuencia o quita el filtro.</div>';
        return;
      }
      res.innerHTML = list.map(e => `
        <article class="card" style="--c:${cvar(e.color)}">
          <div class="card-head">
            <div class="badge" aria-hidden="true">${e.short[0]}</div>
            <h3>${e.name}</h3>
            <button class="btn" data-copy="${e.id}" aria-label="Copiar ${e.name}">${iconCopy} Copiar</button>
          </div>
          <dl class="params" style="margin:0">
            <div class="param"><dt>Low Cut</dt><dd class="num">${e.lowCut}</dd></div>
            <div class="param"><dt>Low Shelf</dt><dd class="num">${e.lowShelf}</dd></div>
            <div class="param boost"><dt>Boost</dt><dd class="num">${e.boost}</dd></div>
            <div class="param"><dt>High Cut</dt><dd class="num">${e.highCut}</dd></div>
          </dl>
          <div class="tip"><b>Pro Tip</b>${e.tip}</div>
        </article>`).join('');
      res.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copyText(eqText(EQ.find(e => e.id === b.dataset.copy)), b)));
    }

    /* Subsección Compresión */
    const fmtRatio = r => `${String(r).replace('.', ',')}:1`;
    const compText = c => `${c.name} (${c.cat})\nRatio: ${fmtRatio(c.ratio)}\nAttack: ${c.attack}\nRelease: ${c.release}\nGanancia / Umbral: ${c.gain}`;

    function mountComp(host) {
      host.innerHTML = `
        <div class="toolbar">
          ${searchBox('Buscar instrumento o ratio (ej. 4:1)')}
          <div class="chips" id="chips">
            ${COMP_CATS.map(c => `<button class="chip" style="--c:${c === 'Todos' ? 'var(--accent)' : cvar(CAT_COLOR[c])}" data-cat="${c}" aria-pressed="false">${c}</button>`).join('')}
          </div>
          <div class="row-actions"><span class="count" id="count"></span><button class="btn primary" id="copyAll"></button></div>
        </div>
        <div class="list" id="results"></div>
        <h2 class="section-title">Intensidad general</h2>
        <div class="presets" id="presets">
          ${PRESETS.map(p => `
            <div class="preset" style="--c:${cvar(p.color)}">
              <h4>${p.name}</h4>
              <dl><dt>Ratio</dt><dd class="num">${p.ratio}</dd><dt>Knee</dt><dd class="num">${p.knee}</dd><dt>Attack</dt><dd class="num">${p.attack}</dd><dt>Release</dt><dd class="num">${p.release}</dd></dl>
              <p style="margin:10px 0 0;font-size:13px;color:var(--muted)">${p.note}</p>
            </div>`).join('')}
        </div>
        <div class="row-actions" style="margin-top:12px"><span></span><button class="btn" id="copyPresets">${iconCopy} Copiar presets</button></div>`;
      bindSearch(host, updateComp);
      host.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        state.cat = c.dataset.cat;
        updateComp();
      }));
      $('#copyPresets').onclick = e => copyText(PRESETS.map(p => `${p.name}: Ratio ${p.ratio}, Knee ${p.knee}, Attack ${p.attack}, Release ${p.release}`).join('\n'), e.currentTarget);
      updateComp();
    }

    function updateComp() {
      const q = norm(state.q.trim());
      const list = COMP.filter(c => (state.cat === 'Todos' || c.cat === state.cat) &&
        (!q || norm([c.name, c.cat, fmtRatio(c.ratio), c.attack, c.release, c.gain].join(' ')).includes(q)));
      document.querySelectorAll('#chips .chip').forEach(c => c.setAttribute('aria-pressed', state.cat === c.dataset.cat));
      $('#count').textContent = `${list.length} de ${COMP.length} fuentes`;
      const all = $('#copyAll');
      const filtered = list.length !== COMP.length;
      all.innerHTML = `${iconCopy} ${state.cat !== 'Todos' ? 'Copiar grupo' : filtered ? 'Copiar coincidencias' : 'Copiar todo'}`;
      all.disabled = !list.length;
      all.onclick = () => copyText(list.map(compText).join('\n\n'), all);
      const res = $('#results');
      if (!list.length) {
        res.innerHTML = '<div class="empty">Sin resultados. Prueba otra categoría o busca un ratio distinto.</div>';
        return;
      }
      res.innerHTML = list.map((c, i) => `
        <article class="card" style="--c:${cvar(CAT_COLOR[c.cat])}">
          <div class="card-head">
            <div class="badge" aria-hidden="true">${c.name[0]}</div>
            <h3>${c.name}<small>${c.cat}</small></h3>
            <button class="btn" data-i="${i}" aria-label="Copiar ${c.name}">${iconCopy} Copiar</button>
          </div>
          <dl class="metrics" style="margin:0">
            <div class="metric"><dt>Ratio</dt><dd class="num">${fmtRatio(c.ratio)}</dd></div>
            <div class="metric"><dt>Attack</dt><dd class="num">${c.attack}</dd></div>
            <div class="metric"><dt>Release</dt><dd class="num">${c.release}</dd></div>
            <div class="metric"><dt>Ganancia / Umbral</dt><dd class="num">${c.gain}</dd></div>
          </dl>
          <div class="ratio-bar" aria-hidden="true"><span style="width:${Math.min(100, c.ratio / 8 * 100)}%"></span></div>
        </article>`).join('');
      res.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => copyText(compText(list[+b.dataset.i]), b)));
    }

    /* Subsección Glosario */
    function mountGloss(host) {
      host.innerHTML = `
        <div class="toolbar">
          ${searchBox('Buscar concepto (ej. knee)')}
          <div class="row-actions"><span class="count" id="count"></span><button class="btn primary" id="copyAll"></button></div>
        </div>
        <div class="list" id="results"></div>`;
      bindSearch(host, updateGloss);
      updateGloss();
    }

    function updateGloss() {
      const q = norm(state.q.trim());
      const list = GLOSS.filter(g => !q || norm(g.term + ' ' + g.def + ' ' + g.typical).includes(q));
      $('#count').textContent = `${list.length} de ${GLOSS.length} conceptos`;
      const all = $('#copyAll');
      all.innerHTML = `${iconCopy} ${list.length !== GLOSS.length ? 'Copiar coincidencias' : 'Copiar glosario'}`;
      all.disabled = !list.length;
      all.onclick = () => copyText(list.map(g => `${g.term}: ${g.def} (${g.typical})`).join('\n\n'), all);
      const res = $('#results');
      if (!list.length) {
        res.innerHTML = '<div class="empty">No hay conceptos con ese término.</div>';
        return;
      }
      res.innerHTML = list.map(g => `
        <article class="card term">
          <h3>${g.term}</h3><p>${g.def}</p>
          <div class="typical"><b>Valores típicos:</b> ${g.typical}</div>
        </article>`).join('');
    }

    /* =========================================================================
       PESTAÑA 2: FLUJO & NIVELES (COMPLETA CON PERSISTENCIA EN LOCALSTORAGE)
       ========================================================================= */
    function formatMs(ms) {
      return `${ms.toFixed(1)} ms`;
    }

    function getGainDiagnostic(db) {
      const amp = Math.pow(10, db / 20);
      const headroom = -db; // respecto a 0 dBFS
      let zone = 'NORMAL';
      let colorVar = '--ok';
      let desc = 'Nivel equilibrado de trabajo con margen saludable para mezcla.';
      let hotAlert = false;

      if (db > -6.0) {
        zone = 'FUERTE';
        colorVar = db > -1.0 ? '--hot' : '--warn';
        desc = 'Señal alta: vigila picos en plugins y margen disponible antes del bus master.';
        hotAlert = true;
      } else if (db < -18.0) {
        zone = 'SILENCIOSO';
        colorVar = '--cyan';
        desc = 'Nivel bajo o de capa ambiental; comprueba que no quede enterrado en la mezcla.';
      }

      return { amp, headroom, zone, colorVar, desc, hotAlert };
    }

    function getActiveProject() {
      const found = state.projects.find(p => p.id === state.activeProjectId);
      return found || state.projects[0];
    }

    function saveProjects() {
      store.setJSON(PROJECTS_KEY, state.projects);
      store.set(ACTIVE_PROJECT_KEY, state.activeProjectId);
    }

    function renderFlujo(v) {
      v.innerHTML = `
        <div class="flow-header-bar">
          <div>
            <h2>Flujo &amp; Niveles</h2>
            <p>Herramientas de estudio con guardado automático de tu sesión.</p>
          </div>
          <button class="btn" id="resetFlowSession">${iconReset} Restablecer sesión</button>
        </div>

        <div class="list">
          <!-- 1. CALCULADORA RÍTMICA POR BPM -->
          <section class="card" style="--c:var(--indigo)">
            <div class="card-head">
              <div class="badge" aria-hidden="true">BPM</div>
              <h3>Calculadora rítmica por BPM<small>Reverb pre-delay, tiempos de delay y release</small></h3>
              <button class="btn" id="copyBpmBtn">${iconCopy} Copiar tiempos</button>
            </div>

            <div class="calc-top">
              <div class="big-readout" style="--c:var(--indigo)">
                <strong id="bpmVal" class="num">${state.lastBPM}</strong>
                <span>BPM</span>
              </div>
              <div style="display:flex;gap:6px;align-items:center">
                <button class="btn step-btn" id="bpmMinus" aria-label="Restar 1 BPM">−1</button>
                <button class="btn step-btn" id="bpmPlus" aria-label="Sumar 1 BPM">+1</button>
              </div>
            </div>

            <div class="slider-row" style="--c:var(--indigo)">
              <span class="num" style="font-size:12px;color:var(--muted)">60</span>
              <input type="range" id="bpmSlider" min="60" max="180" step="1" value="${state.lastBPM}" aria-label="Tempo en BPM">
              <span class="num" style="font-size:12px;color:var(--muted)">180</span>
            </div>

            <div class="preset-pills" style="--c:var(--indigo)" id="bpmPresets">
              <span>Presets:</span>
              ${BPM_PRESETS.map(p => `<button class="pill-btn num" data-bpm="${p}" aria-pressed="${state.lastBPM === p}">${p}</button>`).join('')}
            </div>

            <div class="tap-box">
              <div class="tap-info">
                <strong id="tapStatus">Tap Tempo listo</strong>
                <small id="tapHint">Pulsa al ritmo del tema (mínimo 2 toques) para calcular el BPM medio.</small>
              </div>
              <div class="tap-actions">
                <button class="btn tap-trigger" id="tapBtn">Tap Tempo</button>
                <button class="btn" id="resetTapBtn">Reset Tap</button>
              </div>
            </div>

            <dl class="quick-ms-grid" id="quickMsGrid" style="margin-top:0"></dl>

            <div class="div-table-wrap">
              <table class="div-table">
                <thead>
                  <tr>
                    <th>División rítmica</th>
                    <th>Figura</th>
                    <th>Duración</th>
                  </tr>
                </thead>
                <tbody id="bpmDivTable"></tbody>
              </table>
            </div>
          </section>

          <!-- 2. CALCULADORA DE GANANCIA Y ZONAS EN dB -->
          <section class="card" style="--c:var(--teal)">
            <div class="card-head">
              <div class="badge" aria-hidden="true">dB</div>
              <h3>Calculadora de ganancia y zonas<small>Factor de amplitud lineal y margen de headroom</small></h3>
              <button class="btn" id="copyGainBtn">${iconCopy} Copiar diagnóstico</button>
            </div>

            <div class="calc-top">
              <div class="big-readout" style="--c:var(--teal)">
                <strong id="gainVal" class="num"></strong>
                <span>dBFS</span>
              </div>
              <div style="display:flex;gap:6px;align-items:center">
                <button class="btn step-btn" id="gainMinus" aria-label="Restar 0.5 dB">−0.5</button>
                <button class="btn step-btn" id="gainPlus" aria-label="Sumar 0.5 dB">+0.5</button>
              </div>
            </div>

            <div class="slider-row" style="--c:var(--teal)">
              <span class="num" style="font-size:12px;color:var(--muted)">−24</span>
              <input type="range" id="gainSlider" min="-24" max="24" step="0.5" value="${state.lastGainDB}" aria-label="Ganancia en dB">
              <span class="num" style="font-size:12px;color:var(--muted)">+24</span>
            </div>

            <div class="preset-pills" style="--c:var(--teal)" id="gainPresets">
              <span>Presets:</span>
              ${GAIN_PRESETS.map(g => `<button class="pill-btn num" data-gain="${g}" aria-pressed="${state.lastGainDB === g}">${g > 0 ? '+' + g : g} dB</button>`).join('')}
            </div>

            <div id="gainZoneBox"></div>
            <div id="gainAlertBox"></div>

            <dl class="params" style="margin:0" id="gainMetricsGrid"></dl>
          </section>

          <!-- 3. RESPUESTA DINÁMICA DE COMPRESIÓN -->
          <section class="card" style="--c:var(--purple)">
            <div class="card-head">
              <div class="badge" aria-hidden="true">DYN</div>
              <h3>Respuesta dinámica de compresión<small>Comparativa rápida de intensidad y ataque</small></h3>
            </div>
            <div class="presets">
              ${PRESETS.map(p => `
                <div class="preset" style="--c:${cvar(p.color)}">
                  <h4>${p.name}</h4>
                  <dl>
                    <dt>Ratio</dt><dd class="num">${p.ratio}</dd>
                    <dt>Knee</dt><dd class="num">${p.knee}</dd>
                    <dt>Attack</dt><dd class="num">${p.attack}</dd>
                    <dt>Release</dt><dd class="num">${p.release}</dd>
                  </dl>
                  <p style="margin:8px 0 0;font-size:12.5px;color:var(--muted)">${p.note}</p>
                </div>`).join('')}
            </div>
          </section>

          <!-- 4. FLUJO SUGERIDO DE MEZCLA (CHECKLIST DE 9 PASOS) -->
          <section class="card" style="--c:var(--accent)">
            <div class="card-head">
              <div class="badge" aria-hidden="true">9</div>
              <h3>Flujo sugerido de mezcla<small>Checklist ordenado vinculado a tu proyecto activo</small></h3>
              <button class="btn primary" id="copyFlowBtn">${iconCopy} Exportar flujo</button>
            </div>

            <div class="project-bar">
              <label for="flowProjectSelect">Proyecto activo:</label>
              <select id="flowProjectSelect" class="project-select">
                ${state.projects.map(p => `<option value="${p.id}" ${p.id === state.activeProjectId ? 'selected' : ''}>${p.title} (${p.stage})</option>`).join('')}
              </select>
              <span class="num count" id="flowProgressLabel"></span>
            </div>

            <div class="progress-track" aria-hidden="true">
              <div class="progress-fill" id="flowProgressBar" style="width:0%"></div>
            </div>

            <div class="checklist-grid" id="flowChecklist"></div>
          </section>

          <!-- 5. NIVELES, LUFS Y PANORÁMICA -->
          <section class="card" style="--c:var(--teal)">
            <div class="card-head">
              <div class="badge" aria-hidden="true">LUFS</div>
              <h3>Niveles, LUFS y Panorámica<small>Referencias de sonoridad, True Peak y escena estéreo</small></h3>
              <button class="btn" id="copyLevelsBtn">${iconCopy} Exportar guía</button>
            </div>

            <div class="level-bars">
              ${LEVEL_ZONES.map(z => `
                <div class="lvl-row" style="--c:${cvar(z.color)}">
                  <div class="lvl-head">
                    <strong>${z.name}</strong>
                    <span class="num">${z.range}</span>
                  </div>
                  <div class="lvl-track"><span style="width:${z.pct}%"></span></div>
                  <p style="margin:6px 0 0;font-size:12.5px;color:var(--muted)">${z.desc}</p>
                </div>`).join('')}
            </div>

            <h4 class="section-title" style="margin-top:6px">Objetivos orientativos de LUFS y True Peak</h4>
            <div class="lufs-grid">
              ${LUFS_TARGETS.map(l => `
                <div class="lufs-card" style="--c:${cvar(l.color)}">
                  <h4>${l.title}</h4>
                  <p class="num"><strong>${l.lufs}</strong></p>
                  <p class="num">${l.peak}</p>
                  <small>${l.note}</small>
                </div>`).join('')}
            </div>

            <h4 class="section-title" style="margin-top:6px">Guía de colocación panorámica</h4>
            <div class="pan-grid">
              ${PAN_GUIDES.map(p => `
                <div class="pan-card" style="--c:${cvar(p.color)}">
                  <strong>${p.title}</strong>
                  <p>${p.desc}</p>
                </div>`).join('')}
            </div>
          </section>
        </div>
      `;

      bindFlujoEvents();
      refreshBPMUI();
      refreshGainUI();
      refreshChecklistUI();
    }

    function setBPM(nextBpm) {
      const clamped = Math.min(180, Math.max(60, Math.round(nextBpm)));
      state.lastBPM = clamped;
      store.set('sfp.lastBPM', String(clamped));
      updateSessionPill();
      refreshBPMUI();
    }

    function refreshBPMUI() {
      const bpm = state.lastBPM;
      const quarterMs = 60000 / bpm;
      const eighthMs = quarterMs * 0.5;
      const dottedEighthMs = quarterMs * 0.75;

      const bpmVal = $('#bpmVal');
      const bpmSlider = $('#bpmSlider');
      if (bpmVal) bpmVal.textContent = bpm;
      if (bpmSlider) bpmSlider.value = bpm;

      document.querySelectorAll('#bpmPresets .pill-btn').forEach(b => {
        b.setAttribute('aria-pressed', Number(b.dataset.bpm) === bpm);
      });

      const quickGrid = $('#quickMsGrid');
      if (quickGrid) {
        quickGrid.innerHTML = `
          <div class="quick-ms" style="--c:var(--indigo)">
            <dt>Negra (1/4)</dt>
            <dd class="num">${formatMs(quarterMs)}</dd>
          </div>
          <div class="quick-ms" style="--c:var(--purple)">
            <dt>Corchea (1/8)</dt>
            <dd class="num">${formatMs(eighthMs)}</dd>
          </div>
          <div class="quick-ms" style="--c:var(--teal)">
            <dt>Corchea puntillo (1/8.)</dt>
            <dd class="num">${formatMs(dottedEighthMs)}</dd>
          </div>
        `;
      }

      const tbody = $('#bpmDivTable');
      if (tbody) {
        tbody.innerHTML = RHYTHM_DIVISIONS.map(d => `
          <tr>
            <td><strong>${d.label}</strong></td>
            <td class="num" style="color:var(--muted)">${d.code}</td>
            <td class="num"><strong>${formatMs(quarterMs * d.mult)}</strong></td>
          </tr>
        `).join('');
      }
    }

    function setGainDB(nextGain) {
      const rounded = Math.round(nextGain * 2) / 2;
      const clamped = Math.min(24, Math.max(-24, rounded));
      state.lastGainDB = clamped;
      store.set('sfp.lastGainDB', clamped.toFixed(1));
      updateSessionPill();
      refreshGainUI();
    }

    function refreshGainUI() {
      const db = state.lastGainDB;
      const sign = db > 0 ? '+' : '';
      const diag = getGainDiagnostic(db);

      const gainVal = $('#gainVal');
      const gainSlider = $('#gainSlider');
      if (gainVal) gainVal.textContent = `${sign}${db.toFixed(1)}`;
      if (gainSlider) gainSlider.value = db;

      document.querySelectorAll('#gainPresets .pill-btn').forEach(b => {
        b.setAttribute('aria-pressed', Number(b.dataset.gain) === db);
      });

      const zoneBox = $('#gainZoneBox');
      if (zoneBox) {
        zoneBox.innerHTML = `
          <div class="zone-banner" style="--zc:${cvar(diag.colorVar)}">
            <span class="zone-badge">ZONA ${diag.zone}</span>
            <span class="zone-msg">${diag.desc}</span>
          </div>
        `;
      }

      const alertBox = $('#gainAlertBox');
      if (alertBox) {
        alertBox.innerHTML = diag.hotAlert
          ? `<div class="alert-hot" role="status">⚠ Alerta de nivel: estás por encima de −6.0 dBFS (${sign}${db.toFixed(1)} dB). Controla el headroom antes de sumar pistas.</div>`
          : '';
      }

      const metricsGrid = $('#gainMetricsGrid');
      if (metricsGrid) {
        const headroomText = diag.headroom >= 0
          ? `${diag.headroom.toFixed(1)} dB libres hasta 0 dBFS`
          : `${Math.abs(diag.headroom).toFixed(1)} dB por encima de 0 dBFS (clipping)`;
        metricsGrid.innerHTML = `
          <div class="param">
            <dt>Factor de amplitud</dt>
            <dd class="num">${diag.amp.toFixed(3)}x</dd>
          </div>
          <div class="param">
            <dt>Margen de Headroom (0 dB)</dt>
            <dd class="num">${headroomText}</dd>
          </div>
        `;
      }
    }

    function refreshChecklistUI() {
      const proj = getActiveProject();
      if (!proj) return;
      if (!Array.isArray(proj.steps) || proj.steps.length !== MIX_FLOW_STEPS.length) {
        proj.steps = MIX_FLOW_STEPS.map((_, idx) => Boolean(proj.steps && proj.steps[idx]));
      }

      const completed = proj.steps.filter(Boolean).length;
      const total = MIX_FLOW_STEPS.length;
      const pct = Math.round((completed / total) * 100);

      const progLabel = $('#flowProgressLabel');
      const progBar = $('#flowProgressBar');
      if (progLabel) progLabel.textContent = `${completed}/${total} (${pct}%)`;
      if (progBar) progBar.style.width = `${pct}%`;

      const listEl = $('#flowChecklist');
      if (listEl) {
        listEl.innerHTML = MIX_FLOW_STEPS.map((step, idx) => {
          const done = Boolean(proj.steps[idx]);
          return `
            <button type="button" class="step-item" role="checkbox" aria-checked="${done}" data-step-idx="${idx}">
              <span class="step-check" aria-hidden="true">${done ? '✓' : ''}</span>
              <span class="step-num num">0${idx + 1}</span>
              <span class="step-title">${step.title}</span>
              <span class="step-tag">${step.tag}</span>
            </button>
          `;
        }).join('');

        listEl.querySelectorAll('[data-step-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.stepIdx);
            proj.steps[idx] = !proj.steps[idx];
            proj.updatedAt = new Date().toISOString();
            saveProjects();
            refreshChecklistUI();
          });
        });
      }
    }

    function bindFlujoEvents() {
      /* Restablecer sesión de Flujo & Niveles */
      $('#resetFlowSession').addEventListener('click', () => {
        state.tapTimes = [];
        setBPM(120);
        setGainDB(-6.0);
        const status = $('#tapStatus');
        const hint = $('#tapHint');
        if (status) status.textContent = 'Tap Tempo listo';
        if (hint) hint.textContent = 'Pulsa al ritmo del tema (mínimo 2 toques) para calcular el BPM medio.';
        toast('Sesión restablecida (120 BPM · -6.0 dB)');
      });

      /* Controles BPM */
      $('#bpmSlider').addEventListener('input', e => setBPM(Number(e.target.value)));
      $('#bpmMinus').addEventListener('click', () => setBPM(state.lastBPM - 1));
      $('#bpmPlus').addEventListener('click', () => setBPM(state.lastBPM + 1));
      document.querySelectorAll('#bpmPresets .pill-btn').forEach(btn => {
        btn.addEventListener('click', () => setBPM(Number(btn.dataset.bpm)));
      });

      /* Tap Tempo */
      $('#tapBtn').addEventListener('click', () => {
        const now = performance.now();
        if (state.tapTimes.length && now - state.tapTimes[state.tapTimes.length - 1] > 2500) {
          state.tapTimes = [];
        }
        state.tapTimes.push(now);
        if (state.tapTimes.length > 8) state.tapTimes.shift();

        const status = $('#tapStatus');
        const hint = $('#tapHint');

        if (state.tapTimes.length < 2) {
          if (status) status.textContent = '1 toque registrado...';
          if (hint) hint.textContent = 'Sigue pulsando al compás para calcular el tempo.';
          return;
        }

        let sum = 0;
        for (let i = 1; i < state.tapTimes.length; i++) {
          sum += state.tapTimes[i] - state.tapTimes[i - 1];
        }
        const avgInterval = sum / (state.tapTimes.length - 1);
        const calculatedBpm = Math.round(60000 / avgInterval);
        setBPM(calculatedBpm);

        if (status) status.textContent = `Tap detectado: ${state.lastBPM} BPM (${state.tapTimes.length} toques)`;
        if (hint) hint.textContent = `Intervalo medio: ${avgInterval.toFixed(1)} ms`;
      });

      $('#resetTapBtn').addEventListener('click', () => {
        state.tapTimes = [];
        const status = $('#tapStatus');
        const hint = $('#tapHint');
        if (status) status.textContent = 'Tap Tempo reiniciado';
        if (hint) hint.textContent = 'Pulsa al ritmo del tema (mínimo 2 toques) para calcular el BPM medio.';
      });

      /* Copiar tiempos BPM */
      $('#copyBpmBtn').addEventListener('click', e => {
        const qMs = 60000 / state.lastBPM;
        const lines = [
          `SonicFlowPro — Tiempos rítmicos (${state.lastBPM} BPM)`,
          ...RHYTHM_DIVISIONS.map(d => `• ${d.label} (${d.code}): ${(qMs * d.mult).toFixed(1)} ms`)
        ];
        copyText(lines.join('\n'), e.currentTarget);
      });

      /* Controles Ganancia dB */
      $('#gainSlider').addEventListener('input', e => setGainDB(Number(e.target.value)));
      $('#gainMinus').addEventListener('click', () => setGainDB(state.lastGainDB - 0.5));
      $('#gainPlus').addEventListener('click', () => setGainDB(state.lastGainDB + 0.5));
      document.querySelectorAll('#gainPresets .pill-btn').forEach(btn => {
        btn.addEventListener('click', () => setGainDB(Number(btn.dataset.gain)));
      });

      /* Copiar diagnóstico de ganancia */
      $('#copyGainBtn').addEventListener('click', e => {
        const db = state.lastGainDB;
        const sign = db > 0 ? '+' : '';
        const diag = getGainDiagnostic(db);
        const hr = diag.headroom >= 0
          ? `${diag.headroom.toFixed(1)} dB libres hasta 0 dBFS`
          : `${Math.abs(diag.headroom).toFixed(1)} dB por encima de 0 dBFS`;
        const text = [
          `SonicFlowPro — Diagnóstico de Ganancia`,
          `• Nivel: ${sign}${db.toFixed(1)} dBFS (Zona ${diag.zone})`,
          `• Factor de amplitud: ${diag.amp.toFixed(3)}x`,
          `• Headroom respecto a 0 dB: ${hr}`,
          `• Nota: ${diag.desc}`
        ].join('\n');
        copyText(text, e.currentTarget);
      });

      /* Selector de proyecto en Flujo de Mezcla */
      $('#flowProjectSelect').addEventListener('change', e => {
        state.activeProjectId = e.target.value;
        saveProjects();
        refreshChecklistUI();
      });

      /* Exportar flujo de mezcla */
      $('#copyFlowBtn').addEventListener('click', e => {
        const proj = getActiveProject();
        const completed = proj.steps.filter(Boolean).length;
        const text = [
          `SonicFlowPro — Flujo de Mezcla: ${proj.title} (${completed}/${MIX_FLOW_STEPS.length})`,
          ...MIX_FLOW_STEPS.map((s, i) => `${proj.steps[i] ? '[x]' : '[ ]'} ${i + 1}. ${s.title} (${s.tag})`)
        ].join('\n');
        copyText(text, e.currentTarget);
      });

      /* Exportar guía de niveles, LUFS y panorámica */
      $('#copyLevelsBtn').addEventListener('click', e => {
        const text = [
          'SonicFlowPro — Guía de Niveles, LUFS y Panorámica',
          '',
          'ZONAS DE NIVEL:',
          ...LEVEL_ZONES.map(z => `• ${z.name} (${z.range}): ${z.desc}`),
          '',
          'OBJETIVOS LUFS Y TRUE PEAK:',
          ...LUFS_TARGETS.map(l => `• ${l.title}: ${l.lufs} | ${l.peak} — ${l.note}`),
          '',
          'COLOCACIÓN PANORÁMICA:',
          ...PAN_GUIDES.map(p => `• ${p.title}: ${p.desc}`)
        ].join('\n');
        copyText(text, e.currentTarget);
      });
    }

    /* =========================================================================
       PESTAÑA 3: MIS MEZCLAS (VISTA PREVIA CONECTADA AL MISMO LOCALSTORAGE)
       ========================================================================= */
    function renderMezclasPreview(v) {
      const totalSteps = MIX_FLOW_STEPS.length;
      const cards = state.projects.map(p => {
        const done = Array.isArray(p.steps) ? p.steps.filter(Boolean).length : 0;
        const pct = Math.round((done / totalSteps) * 100);
        return `
          <article class="card" style="--c:var(--accent)">
            <div class="card-head" style="margin-bottom:8px">
              <div class="badge" aria-hidden="true">${pct}%</div>
              <h3>${p.title}<small>${p.meta || 'Sin datos'} · Fase: ${p.stage}</small></h3>
              <span class="num count">${done}/${totalSteps} pasos</span>
            </div>
            <div class="progress-track" style="margin-bottom:8px">
              <div class="progress-fill" style="width:${pct}%"></div>
            </div>
            <p style="margin:0;font-size:13px;color:var(--muted)">${p.notes || 'Sin notas todavía.'}</p>
          </article>
        `;
      }).join('');

      v.innerHTML = `
        <section class="card todo" style="margin-bottom:14px">
          <h2>Mis Mezclas (Bloque final)</h2>
          <p>Tus proyectos ya comparten almacenamiento en <code>localStorage</code> con el checklist de <strong>Flujo &amp; Niveles</strong>. En el siguiente paso añadiremos el gestor completo:</p>
          <ul>
            <li>Crear mezclas con título, BPM o tonalidad, fase y notas</li>
            <li>Contadores, búsqueda, filtros y ordenación</li>
            <li>Detalle por canción con checklist interactivo, duplicado y exportación</li>
          </ul>
        </section>
        <div class="list">${cards}</div>
      `;
    }

    /* =========================================================================
       ARRANQUE
       ========================================================================= */
    setTab(TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get('sfp.tab', 'guia'), true);
  </script>
</body>
</html>
